<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Documentação interativa da API TM Hub">
    <title>TM Hub API — Swagger</title>
    <link
        rel="icon"
        type="image/png"
        href="https://raw.githubusercontent.com/foxtec198/tmhub/main/public/brands/main_fav.png"
    >
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
    <style>
        :root {
            color-scheme: dark;
            --accent: #4bd66e;
            --surface: #111713;
            --surface-2: #19251c;
            --border: #315b3b;
            --text: #f3f7f4;
            --muted: #aebbb1;
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: #080b09; }

        .api-header {
            position: sticky;
            z-index: 20;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: .8rem clamp(1rem, 4vw, 3rem);
            color: var(--text);
            border-bottom: 1px solid var(--border);
            background: rgba(8, 14, 10, .94);
            backdrop-filter: blur(14px);
            font-family: Inter, "Segoe UI", sans-serif;
        }

        .api-brand { display: flex; align-items: center; gap: .85rem; }
        .api-logo {
            display: block;
            width: 7.8rem;
            height: 2.7rem;
            object-fit: contain;
            object-position: left center;
            animation: float 2.4s ease-in-out infinite;
        }
        .api-brand strong { display: block; font-size: 1rem; }
        .api-brand span, .api-status { color: var(--muted); font-size: .78rem; }
        .api-status::before {
            display: inline-block;
            width: .55rem;
            height: .55rem;
            margin-right: .4rem;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 .25rem rgba(75, 214, 110, .12);
            content: "";
        }

        .api-search {
            max-width: 1460px;
            padding: 1rem 1.25rem 0;
            margin: 0 auto;
            font-family: Inter, "Segoe UI", sans-serif;
        }
        .api-search label {
            display: block;
            margin-bottom: .4rem;
            color: var(--muted);
            font-size: .75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .api-search-field {
            position: relative;
        }
        .api-search-field span {
            position: absolute;
            top: 50%;
            left: 1rem;
            color: #78df91;
            transform: translateY(-50%);
        }
        .api-search input {
            width: 100%;
            padding: .85rem 1rem .85rem 2.75rem;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: var(--surface);
            font: inherit;
        }
        .api-search input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 .18rem rgba(75, 214, 110, .13);
        }
        .api-search input::placeholder { color: #8fa096; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .swagger-ui { color: var(--text); }
        .swagger-ui .topbar { display: none; }
        .swagger-ui .info { margin: 32px 0 24px; }
        .swagger-ui .info .title,
        .swagger-ui .info p,
        .swagger-ui .info li,
        .swagger-ui .scheme-container,
        .swagger-ui .opblock-tag,
        .swagger-ui .opblock-description-wrapper p,
        .swagger-ui .response-col_status,
        .swagger-ui .response-col_description,
        .swagger-ui table thead tr th,
        .swagger-ui table thead tr td,
        .swagger-ui label,
        .swagger-ui .parameter__name,
        .swagger-ui .parameter__type,
        .swagger-ui .model-title,
        .swagger-ui .model {
            color: var(--text);
        }
        .swagger-ui .info .title small { background: #1f6e33; }
        .swagger-ui .info a, .swagger-ui .opblock-tag:hover { color: var(--accent); }
        .swagger-ui .scheme-container {
            background: var(--surface);
            box-shadow: none;
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .swagger-ui .opblock-tag { border-bottom-color: var(--border); }
        .swagger-ui .opblock {
            overflow: hidden;
            border-radius: 10px;
            box-shadow: none;
        }
        .swagger-ui .opblock .opblock-summary-description,
        .swagger-ui .opblock .opblock-summary-path,
        .swagger-ui .opblock .opblock-summary-path__deprecated {
            color: #f3f7f4 !important;
        }
        .swagger-ui .opblock .opblock-summary-description {
            color: #c4d0c7 !important;
        }
        .swagger-ui .opblock-tag small,
        .swagger-ui .opblock-tag small p,
        .swagger-ui .info .base-url,
        .swagger-ui .info .link,
        .swagger-ui .markdown p,
        .swagger-ui .markdown li {
            color: #b7c2ba !important;
        }
        .swagger-ui .opblock-body,
        .swagger-ui section.models {
            color: var(--text);
            background: var(--surface);
        }
        .swagger-ui .opblock .opblock-section-header,
        .swagger-ui .opblock .opblock-section-header h4,
        .swagger-ui .opblock .opblock-section-header label,
        .swagger-ui .responses-inner h4,
        .swagger-ui .responses-inner h5 {
            color: var(--text) !important;
            background: var(--surface-2) !important;
        }
        .swagger-ui .opblock .opblock-section-header {
            min-height: 3.25rem;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            box-shadow: none;
        }
        .swagger-ui .parameters-container,
        .swagger-ui .responses-wrapper,
        .swagger-ui .request-body,
        .swagger-ui .table-container {
            color: var(--text);
            background: var(--surface) !important;
        }
        .swagger-ui .parameters-col_description,
        .swagger-ui .parameter__in,
        .swagger-ui .response-col_links,
        .swagger-ui .response-col_links i,
        .swagger-ui .tab li,
        .swagger-ui .renderedMarkdown p {
            color: var(--muted) !important;
        }
        .swagger-ui .parameter__name,
        .swagger-ui .parameter__type,
        .swagger-ui .parameter__deprecated,
        .swagger-ui .response-col_status,
        .swagger-ui .response-col_description,
        .swagger-ui .response-col_description p,
        .swagger-ui .response-col_description code,
        .swagger-ui .model-title,
        .swagger-ui .model,
        .swagger-ui .model-box,
        .swagger-ui .prop-name,
        .swagger-ui .prop-type,
        .swagger-ui .prop-format,
        .swagger-ui .model-toggle,
        .swagger-ui .brace-open,
        .swagger-ui .brace-close {
            color: #e7eee9 !important;
        }
        .swagger-ui .prop-type,
        .swagger-ui .parameter__type,
        .swagger-ui .parameter__in {
            color: #79e897 !important;
        }
        .swagger-ui .tab li button.tablinks,
        .swagger-ui .response-control-media-type__accept-message,
        .swagger-ui .download-contents {
            color: #9eebaf !important;
        }
        .swagger-ui table tbody tr td,
        .swagger-ui table thead tr th,
        .swagger-ui .responses-table td {
            border-color: #283a2d !important;
            background: transparent !important;
        }
        .swagger-ui .opblock-body pre.microlight {
            color: #f4f7f5 !important;
            background: #202320 !important;
        }
        .swagger-ui section.models {
            border-color: var(--border);
            border-radius: 10px;
        }
        .swagger-ui input, .swagger-ui select, .swagger-ui textarea {
            color: var(--text);
            border-color: var(--border);
            background: #0d120f;
        }
        .swagger-ui .operation-filter-input {
            color: var(--text) !important;
            border: 1px solid var(--border) !important;
            background: #111713 !important;
        }
        .swagger-ui .operation-filter-input::placeholder {
            color: #8fa096;
        }
        .swagger-ui .btn.try-out__btn,
        .swagger-ui .btn.execute {
            color: var(--text);
            border-color: #4b7256;
            background: #1c2a20;
        }
        .swagger-ui .btn.authorize {
            color: #156128;
            border-color: #249443;
        }
        .swagger-ui .btn.authorize svg { fill: #249443; }

        @media (max-width: 640px) {
            .api-status { display: none; }
            .swagger-ui .wrapper { padding: 0 .7rem; }
        }
    </style>
</head>
<body>
    <header class="api-header">
        <div class="api-brand">
            <img
                class="api-logo"
                src="https://raw.githubusercontent.com/foxtec198/tmhub/main/public/brands/main_brand_white.svg"
                alt="TM Hub — Painel Executivo"
            >
            <div>
                <strong>TM Hub API</strong>
                <span>Documentação interativa OpenAPI</span>
            </div>
        </div>
        <div class="api-status">API em execução</div>
    </header>
    <div class="api-search">
        <label for="api-operation-search">Pesquisa global</label>
        <div class="api-search-field">
            <span aria-hidden="true">⌕</span>
            <input
                id="api-operation-search"
                type="search"
                placeholder="Buscar por método, endpoint, tag ou categoria"
                autocomplete="off"
            >
        </div>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" crossorigin></script>
    <script>
        window.onload = () => {
            window.ui = SwaggerUIBundle({
                url: "/openapi.json",
                dom_id: "#swagger-ui",
                deepLinking: true,
                displayRequestDuration: true,
                filter: false,
                persistAuthorization: true,
                tryItOutEnabled: false,
                docExpansion: "list",
                defaultModelsExpandDepth: 1,
                validatorUrl: null
            });

            const search = document.getElementById("api-operation-search");
            const normalize = (value) => value
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
            const applySearch = () => {
                const query = normalize(search.value);
                document.querySelectorAll(".opblock-tag-section").forEach((section) => {
                    const tag = section.querySelector(".opblock-tag");
                    const tagText = normalize(tag?.textContent || "");
                    const tagMatches = !query || tagText.includes(query);
                    let hasVisibleOperation = false;

                    section.querySelectorAll(".opblock").forEach((operation) => {
                        const operationMatches = tagMatches
                            || normalize(operation.textContent || "").includes(query);
                        operation.style.display = operationMatches ? "" : "none";
                        hasVisibleOperation ||= operationMatches;
                    });
                    section.style.display = hasVisibleOperation || tagMatches ? "" : "none";
                });
            };
            search.addEventListener("input", applySearch);
            const keepSearchApplied = new MutationObserver(applySearch);
            keepSearchApplied.observe(document.getElementById("swagger-ui"), {
                childList: true,
                subtree: true
            });
        };
    </script>
</body>
</html>
